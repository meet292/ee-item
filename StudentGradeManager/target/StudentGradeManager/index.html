<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4A 班级学生成绩管理系统</title>
<style>
    :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --bg: #f1f5fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --green: #16a34a;
        --orange: #d97706;
        --gray: #6b7280;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    .hero {
        background: linear-gradient(120deg, #1e3a8a, #2563eb 55%, #3b82f6);
        color: #fff;
        padding: 30px 20px 26px;
        text-align: center;
    }

    .hero h1 { margin: 0; font-size: 26px; letter-spacing: 1px; }

    .hero p { margin: 8px 0 0; font-size: 13px; opacity: .85; letter-spacing: 2px; }

    .tabs {
        display: flex;
        justify-content: center;
        gap: 6px;
        padding: 14px 12px 0;
        flex-wrap: wrap;
    }

    .tab {
        border: none;
        background: transparent;
        color: var(--muted);
        padding: 10px 22px;
        font-size: 15px;
        border-radius: 10px 10px 0 0;
        cursor: pointer;
        transition: all .18s;
    }

    .tab:hover { color: var(--primary); background: rgba(37, 99, 235, .06); }

    .tab.active {
        background: var(--card);
        color: var(--primary);
        font-weight: 600;
        box-shadow: 0 -2px 10px rgba(37, 99, 235, .10);
    }

    main { max-width: 1060px; margin: 0 auto 40px; padding: 0 16px; }

    .panel {
        display: none;
        background: var(--card);
        border-radius: 0 0 14px 14px;
        box-shadow: 0 6px 24px rgba(30, 58, 138, .08);
        padding: 26px 28px 30px;
        min-height: 430px;
    }

    .panel.active { display: block; animation: fade .18s ease-in; }

    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    h2 { font-size: 17px; margin: 0 0 18px; color: var(--primary-dark); font-weight: 600; }

    .form-grid {
        display: grid;
        grid-template-columns: 96px minmax(180px, 300px) auto;
        gap: 14px 12px;
        align-items: center;
        max-width: 720px;
    }

    label { color: #374151; font-size: 14px; }

    input[type="text"], input[type="number"] {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition: border-color .15s, box-shadow .15s;
    }

    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }

    input:disabled { background: #f3f4f6; color: #6b7280; }

    .btn {
        border: none;
        border-radius: 8px;
        padding: 9px 18px;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
        transition: all .15s;
        white-space: nowrap;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-light { background: #eef2ff; color: var(--primary-dark); }
    .btn-light:hover { background: #e0e7ff; }

    .actions { margin-top: 22px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

    .hint { font-size: 13px; }
    .hint.ok { color: var(--green); }
    .hint.warn { color: var(--orange); }
    .hint.err { color: #dc2626; }

    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }

    .toolbar input { max-width: 260px; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }

    thead th {
        background: #f8fafc;
        color: #334155;
        font-weight: 600;
        text-align: left;
        padding: 11px 12px;
        border-bottom: 2px solid var(--border);
        white-space: nowrap;
    }

    tbody td { padding: 10px 12px; border-bottom: 1px solid #f1f3f7; }

    tbody tr:hover { background: #f8faff; }

    .muted { color: #cbd5e1; }

    .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12px;
    }

    .badge-green { background: #dcfce7; color: var(--green); }
    .badge-orange { background: #fef3c7; color: var(--orange); }
    .badge-gray { background: #f1f5f9; color: var(--gray); }

    .stats-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 22px; }

    .stat-card {
        background: linear-gradient(145deg, #f8fbff, #eef4ff);
        border: 1px solid #e0eaff;
        border-radius: 12px;
        padding: 16px 18px;
    }

    .stat-card .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }

    .stat-card .value { font-size: 24px; font-weight: 700; color: var(--primary-dark); }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 22px; }

    .stat-block h3 { font-size: 14px; color: #334155; margin: 0 0 10px; font-weight: 600; }

    .empty { text-align: center; color: var(--muted); padding: 34px 0; font-size: 14px; }

    footer { text-align: center; color: #9ca3af; font-size: 12px; padding: 0 0 26px; }
</style>
</head>
<body>

<header class="hero">
    <h1>4A 班级学生成绩管理系统</h1>
    <p>教师录入 · 学生查询 · 平均分 · 及格率</p>
</header>

<nav class="tabs">
    <button class="tab active" data-tab="input">成绩录入</button>
    <button class="tab" data-tab="query">学生查询</button>
    <button class="tab" data-tab="stats">统计分析</button>
    <button class="tab" data-tab="list">学生名单</button>
</nav>

<main>
    <!-- 成绩录入 -->
    <section class="panel active" id="tab-input">
        <h2>教师录入 / 修改成绩</h2>
        <div class="form-grid">
            <label for="id">学号</label>
            <input type="text" id="id" placeholder="如 A006" autocomplete="off">
            <button class="btn btn-light" id="findBtn">查找学生</button>

            <label for="name">姓名</label>
            <input type="text" id="name" placeholder="新增学生时填写" autocomplete="off">

            <label for="className">班级</label>
            <input type="text" id="className" placeholder="默认 4A班" autocomplete="off">

            <label for="s0">语文成绩</label>
            <input type="number" id="s0" min="0" max="100" step="0.5" placeholder="0 ~ 100">

            <label for="s1">数学成绩</label>
            <input type="number" id="s1" min="0" max="100" step="0.5" placeholder="0 ~ 100">

            <label for="s2">英语成绩</label>
            <input type="number" id="s2" min="0" max="100" step="0.5" placeholder="0 ~ 100">
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="saveBtn">保存成绩</button>
            <span class="hint" id="inputHint">输入学号后点击「查找学生」，可直接修改已有成绩</span>
        </div>
    </section>

    <!-- 学生查询 -->
    <section class="panel" id="tab-query">
        <h2>学生成绩查询</h2>
        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="输入学号或姓名，支持模糊查询" autocomplete="off">
            <button class="btn btn-primary" id="searchBtn">查询</button>
            <button class="btn btn-light" id="allBtn">显示全部</button>
        </div>
        <table>
            <thead>
            <tr>
                <th>学号</th><th>姓名</th><th>班级</th>
                <th>语文</th><th>数学</th><th>英语</th>
                <th>总分</th><th>平均分</th><th>状态</th>
            </tr>
            </thead>
            <tbody id="queryBody"></tbody>
        </table>
        <div class="empty" id="queryEmpty" style="display:none">没有找到匹配的学生</div>
    </section>

    <!-- 统计分析 -->
    <section class="panel" id="tab-stats">
        <h2>班级成绩统计</h2>
        <div class="stats-cards">
            <div class="stat-card">
                <div class="label">班级总平均分</div>
                <div class="value" id="cardAvg">-</div>
            </div>
            <div class="stat-card">
                <div class="label">班级总及格率</div>
                <div class="value" id="cardRate">-</div>
            </div>
            <div class="stat-card">
                <div class="label">学生人数</div>
                <div class="value" id="cardStudents">-</div>
            </div>
            <div class="stat-card">
                <div class="label">成绩条数</div>
                <div class="value" id="cardScores">-</div>
            </div>
        </div>

        <div class="stat-grid">
            <div class="stat-block">
                <h3>各科平均分</h3>
                <table>
                    <thead><tr><th>科目</th><th>平均分</th><th>录入人数</th></tr></thead>
                    <tbody id="avgBody"></tbody>
                </table>
            </div>
            <div class="stat-block">
                <h3>各科及格率</h3>
                <table>
                    <thead><tr><th>科目</th><th>及格人数</th><th>参考人数</th><th>及格率</th></tr></thead>
                    <tbody id="passBody"></tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- 学生名单 -->
    <section class="panel" id="tab-list">
        <h2>班级学生名单 <span style="font-size:13px;font-weight:400;color:#6b7280" id="listCount"></span></h2>
        <table>
            <thead>
            <tr>
                <th>学号</th><th>姓名</th><th>班级</th>
                <th>语文</th><th>数学</th><th>英语</th>
                <th>总分</th><th>平均分</th><th>状态</th>
            </tr>
            </thead>
            <tbody id="listBody"></tbody>
        </table>
    </section>
</main>

<footer>数据保存在本次运行的内存中，重启服务器后恢复为示例数据</footer>

<script>
    const SUBJECTS = ['语文', '数学', '英语'];
    const PASS_LINE = 60;
    let currentStudentId = null;

    const $ = (id) => document.getElementById(id);

    document.querySelectorAll('.tab').forEach((btn) => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach((b) => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
            btn.classList.add('active');
            $('tab-' + btn.dataset.tab).classList.add('active');
        });
    });

    function escapeHtml(value) {
        return String(value === undefined || value === null ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function scoreText(value) {
        return Number.isInteger(value) ? String(value) : value.toFixed(1);
    }

    function statusBadge(student) {
        const count = student.scores ? Object.keys(student.scores).length : 0;
        if (count === 0) {
            return '<span class="badge badge-gray">未录入</span>';
        }
        return student.average >= PASS_LINE
            ? '<span class="badge badge-green">合格</span>'
            : '<span class="badge badge-orange">待提高</span>';
    }

    function studentCells(student) {
        const cells = SUBJECTS.map((subject) => {
            const value = student.scores[subject];
            return '<td>' + (value === undefined
                ? '<span class="muted">—</span>'
                : scoreText(value)) + '</td>';
        }).join('');
        return '<td>' + escapeHtml(student.id) + '</td>'
            + '<td>' + escapeHtml(student.name) + '</td>'
            + '<td>' + escapeHtml(student.className) + '</td>'
            + cells
            + '<td>' + (student.total > 0 ? student.total.toFixed(2) : '<span class="muted">—</span>') + '</td>'
            + '<td>' + (student.total > 0 ? student.average.toFixed(2) : '<span class="muted">—</span>') + '</td>'
            + '<td>' + statusBadge(student) + '</td>';
    }

    async function request(url, options) {
        const response = await fetch(url, options);
        return response.json();
    }

    function setHint(text, type) {
        const hint = $('inputHint');
        hint.textContent = text;
        hint.className = 'hint ' + (type || '');
    }

    // ---------- 查询 ----------

    async function loadStudents(keyword, target) {
        const url = 'api/students?keyword=' + encodeURIComponent(keyword || '');
        const data = await request(url);
        const students = data.students || [];
        const body = $(target === 'query' ? 'queryBody' : 'listBody');
        body.innerHTML = students.map((student) =>
            '<tr>' + studentCells(student) + '</tr>').join('');

        if (target === 'query') {
            $('queryEmpty').style.display = students.length === 0 ? 'block' : 'none';
        } else {
            $('listCount').textContent = '共 ' + students.length + ' 名学生';
        }
    }

    function search() {
        loadStudents($('searchInput').value.trim(), 'query');
    }

    // ---------- 录入 ----------

    function fillForm(student) {
        $('id').value = student.id;
        $('name').value = student.name;
        $('className').value = student.className;
        $('name').disabled = true;
        $('className').disabled = true;
        SUBJECTS.forEach((subject, index) => {
            const value = student.scores[subject];
            $('s' + index).value = value === undefined ? '' : scoreText(value);
        });
        currentStudentId = student.id;
        setHint('已找到学生：' + student.name + '（' + student.className + '），可直接修改成绩', 'ok');
    }

    function resetForm() {
        $('name').value = '';
        $('className').value = '4A班';
        $('name').disabled = false;
        $('className').disabled = false;
        SUBJECTS.forEach((subject, index) => { $('s' + index).value = ''; });
        currentStudentId = null;
    }

    async function findStudent() {
        const id = $('id').value.trim();
        if (!id) {
            setHint('请先输入学号', 'warn');
            return;
        }
        const data = await request('api/students?keyword=' + encodeURIComponent(id));
        const student = (data.students || []).find((item) => item.id === id);
        if (student) {
            fillForm(student);
        } else {
            resetForm();
            setHint('未找到学号 ' + id + ' 的学生。填写姓名和成绩后保存，将新增该学生。', 'warn');
        }
    }

    async function saveScores() {
        const id = $('id').value.trim();
        if (!id) {
            setHint('学号不能为空', 'err');
            return;
        }
        const params = new URLSearchParams();
        params.set('id', id);
        params.set('name', $('name').value.trim());
        params.set('className', $('className').value.trim());
        SUBJECTS.forEach((subject, index) => {
            params.set(subject, $('s' + index).value.trim());
        });

        const data = await request('api/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'},
            body: params.toString()
        });

        if (data.ok) {
            setHint(data.message + '，总分 ' + data.student.total.toFixed(2)
                + '，平均分 ' + data.student.average.toFixed(2), 'ok');
            $('name').value = data.student.name;
            $('className').value = data.student.className;
            $('name').disabled = true;
            $('className').disabled = true;
            currentStudentId = data.student.id;
            refreshAll();
        } else {
            setHint(data.message, 'err');
        }
    }

    // ---------- 统计 ----------

    async function loadStats() {
        const data = await request('api/stats');
        if (!data.ok) {
            return;
        }
        const overall = data.overall;
        $('cardAvg').textContent = overall.average.toFixed(2);
        $('cardRate').textContent = overall.passRate.toFixed(2) + '%';
        $('cardStudents').textContent = overall.studentCount;
        $('cardScores').textContent = overall.totalCount + ' 条';

        $('avgBody').innerHTML = data.subjects.map((item) =>
            '<tr><td>' + escapeHtml(item.name) + '</td>'
            + '<td>' + (item.count === 0 ? '<span class="muted">暂无数据</span>' : item.average.toFixed(2)) + '</td>'
            + '<td>' + item.count + '</td></tr>').join('');

        $('passBody').innerHTML = data.subjects.map((item) =>
            '<tr><td>' + escapeHtml(item.name) + '</td>'
            + '<td>' + (item.count === 0 ? '-' : item.pass) + '</td>'
            + '<td>' + item.count + '</td>'
            + '<td>' + (item.count === 0 ? '<span class="muted">暂无数据</span>'
                : item.passRate.toFixed(2) + '%') + '</td></tr>').join('');
    }

    function refreshAll() {
        loadStudents($('searchInput').value.trim(), 'query');
        loadStudents('', 'list');
        loadStats();
    }

    // ---------- 事件 ----------

    $('findBtn').addEventListener('click', findStudent);
    $('id').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') { findStudent(); }
    });
    $('saveBtn').addEventListener('click', saveScores);
    $('searchBtn').addEventListener('click', search);
    $('allBtn').addEventListener('click', () => {
        $('searchInput').value = '';
        search();
    });
    $('searchInput').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') { search(); }
    });

    refreshAll();
</script>
</body>
</html>
